[workspace]
resolver = "2"
members = ["crates/core", "crates/terminal", "crates/app"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.7.0"

[workspace.dependencies]
iced = { version = "=0.14.0", features = ["canvas", "lazy", "advanced", "tokio"] }
iced_core = "=0.14.0"
iced_graphics = { version = "=0.14.0", default-features = false }
alacritty_terminal = "0.26.0"

# Fast debug builds for `cargo watch`: optimize dependencies, keep our own crates quick to rebuild.
[profile.dev.package."*"]
opt-level = 3
# Line numbers only for dependencies: backtraces still work, target/ stays much smaller.
debug = "line-tables-only"
