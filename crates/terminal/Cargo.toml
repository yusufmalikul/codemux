[package]
name = "codemux-terminal"
description = "Terminal widget for Iced, based on iced_term 0.8 (MIT)"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "codemux_terminal"
# No doc examples; skip the doc-test build on every `cargo test`.
doctest = false

[dependencies]
alacritty_terminal.workspace = true
iced.workspace = true
iced_core.workspace = true
iced_graphics.workspace = true
open = "5"
# Only channels and the async Mutex; iced brings the runtime itself.
tokio = { version = "1", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
