[package]
name = "codemux"
description = "Session manager for Claude Code"
edition.workspace = true
license.workspace = true
version.workspace = true

# Capital C: macOS shows the binary name in the Dock and menu bar.
[[bin]]
name = "Codemux"
path = "src/main.rs"

[dependencies]
codemux-core = { path = "../core" }
codemux-terminal = { path = "../terminal" }
iced.workspace = true
# Folder picker. Default features pull in async-std; we already run on tokio through iced.
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify-rust = "4.18.2"

[dev-dependencies]
iced_test = "=0.14.0"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

# Decodes the window icon. macOS takes its icon from the .app bundle or NSImage instead.
[target.'cfg(not(target_os = "macos"))'.dependencies]
png = "0.18"

# Only used when building on Windows (see build.rs).
[target.'cfg(windows)'.build-dependencies]
ico = "0.4"
winresource = "0.1"
