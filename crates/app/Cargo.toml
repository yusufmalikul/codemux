[package]
name = "codemux"
description = "Session manager for Claude Code"
edition.workspace = true
license.workspace = true
version.workspace = true

# Capital C: macOS shows the binary name in the Dock and menu bar.
[[bin]]
name = "Codemux"
path = "src/main.rs"

[dependencies]
codemux-core = { path = "../core" }
codemux-terminal = { path = "../terminal" }
iced.workspace = true
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
iced_test = "=0.14.0"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
